<!DOCTYPE html>
<html lang="bn" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Cover Page Generator</title>


    <link rel="manifest" href="https://cover-kappa-ten.vercel.app/icons/manifest.json">
    <meta name="theme-color" content="#A9EFC7">
    <link rel="icon" href="https://cover-kappa-ten.vercel.app/icons/favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* ── M3 COLOR TOKENS ─────────────────── */
        :root {
            --ease: cubic-bezier(0.2, 0, 0, 1);
            --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --t: 0.3s cubic-bezier(0.2, 0, 0, 1);

            /* State layers */
            --state-hover: rgba(255, 255, 255, .08);
            --state-press: rgba(255, 255, 255, .12);
            --state-focus: rgba(255, 255, 255, .12);
        }

        /* Dark scheme — M3 tonal palette (emerald-green seed) */
        [data-theme="dark"] {
            --md-primary: #72DBA0;
            --md-on-primary: #003920;
            --md-primary-container: #0A5230;
            --md-on-primary-cont: #A0EFBF;

            --md-secondary: #A8C8AF;
            --md-on-secondary: #1A3320;
            --md-secondary-cont: #304A37;
            --md-on-secondary-cont: #C4E4CB;

            --md-tertiary: #7ED4D6;
            --md-on-tertiary: #003739;
            --md-tertiary-cont: #004F52;
            --md-on-tertiary-cont: #A2EFF1;

            --md-surface: #0C1410;
            --md-surface-1: #161F19;
            --md-surface-2: #1B261E;
            --md-surface-3: #202D23;
            --md-surface-4: #223026;
            --md-surface-5: #25342A;
            --md-on-surface: #DCE8DC;
            --md-on-surface-var: #ADBCAF;
            --md-outline: #7A9880;
            --md-outline-var: #3A4E3D;
            --md-inverse-surface: #DCE8DC;
            --md-inverse-on-surf: #2A3A2C;

            --md-bg: #0C1410;
            --md-scrim: rgba(0, 0, 0, .65);
            --md-shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 1px 3px rgba(0, 0, 0, .18);
            --md-shadow-2: 0 1px 2px rgba(0, 0, 0, .35), 0 2px 6px rgba(0, 0, 0, .18);
            --md-shadow-3: 0 4px 8px rgba(0, 0, 0, .35), 0 1px 3px rgba(0, 0, 0, .18);

            --sk-b: #161F19;
            --sk-s: #202D23;
        }

        /* Light scheme — green seed */
        [data-theme="light"] {
            --md-primary: #1A6B3F;
            --md-on-primary: #FFFFFF;
            --md-primary-container: #AAEFC8;
            --md-on-primary-cont: #002111;

            --md-secondary: #4A6350;
            --md-on-secondary: #FFFFFF;
            --md-secondary-cont: #CCE8D2;
            --md-on-secondary-cont: #071F0D;

            --md-tertiary: #006B6D;
            --md-on-tertiary: #FFFFFF;
            --md-tertiary-cont: #9CF0F2;
            --md-on-tertiary-cont: #002021;

            --md-surface: #F4FBF0;
            --md-surface-1: #EAF4E6;
            --md-surface-2: #E2EFDD;
            --md-surface-3: #DAEBD5;
            --md-surface-4: #D7E8D2;
            --md-surface-5: #D2E4CC;
            --md-on-surface: #0F1F12;
            --md-on-surface-var: #3D5040;
            --md-outline: #527558;
            --md-outline-var: #BCCFBE;
            --md-inverse-surface: #243528;
            --md-inverse-on-surf: #EAF4E6;

            --md-bg: #F4FBF0;
            --md-scrim: rgba(0, 0, 0, .42);
            --md-shadow: 0 1px 2px rgba(0, 0, 0, .1), 0 1px 3px rgba(0, 0, 0, .07);
            --md-shadow-2: 0 1px 2px rgba(0, 0, 0, .1), 0 2px 6px rgba(0, 0, 0, .07);
            --md-shadow-3: 0 4px 8px rgba(0, 0, 0, .1), 0 1px 3px rgba(0, 0, 0, .07);

            --sk-b: #DCE9D8;
            --sk-s: #E6F0E2;
        }

        html,
        body {
            height: 100%;
        }

        body {
            background: var(--md-bg);
            color: var(--md-on-surface);
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            transition: background var(--t), color var(--t);
        }

        #veil {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--md-bg);
            opacity: 0;
            pointer-events: none;
            transition: opacity .24s ease;
        }

        #veil.out {
            opacity: 1;
            pointer-events: all;
        }

        /* ── KEYFRAMES ───────────────────────── */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-12px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0
            }

            to {
                opacity: 1
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(.92)
            }

            to {
                opacity: 1;
                transform: scale(1)
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(20px)
            }

            to {
                opacity: 1;
                transform: translateX(0)
            }
        }

        @keyframes ripM3 {
            to {
                transform: scale(10);
                opacity: 0
            }
        }

        /* Skeleton shimmer — wave passes left to right */
        @keyframes shimmer {
            0% {
                background-position: -600px 0;
            }

            100% {
                background-position: 600px 0;
            }
        }

        /* Skeleton pulse — gentle opacity breathe */
        @keyframes skelPulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .55;
            }
        }

        /* Hero blobs float */
        @keyframes blobFloat {

            0%,
            100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-8px) scale(1.04);
            }
        }

        /* Topbar slide down on load */
        @keyframes topbarIn {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* FAB pop in */
        @keyframes fabPop {
            0% {
                opacity: 0;
                transform: scale(.4) rotate(-20deg);
            }

            70% {
                transform: scale(1.12) rotate(4deg);
            }

            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        /* Card stagger rise */
        @keyframes cardRise {
            from {
                opacity: 0;
                transform: translateY(24px) scale(.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Count chip bounce */
        @keyframes chipBounce {

            0%,
            100% {
                transform: scale(1);
            }

            40% {
                transform: scale(1.18);
            }

            60% {
                transform: scale(.94);
            }
        }

        /* ── M3 TOP APP BAR (small) ─────────────── */
        #topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 300;
            height: calc(64px + env(safe-area-inset-top, 0px));
            padding-top: env(safe-area-inset-top, 0px);
            display: flex;
            align-items: center;
            padding: env(safe-area-inset-top, 0px) 4px 0 4px;
            background: var(--md-surface-2);
            transition: background var(--t), box-shadow .2s;
            animation: topbarIn .45s var(--ease) both;
        }

        #topbar.scrolled {
            box-shadow: var(--md-shadow-2);
            background: var(--md-surface-3);
        }

        .topbar-inner {
            width: 100%;
            height: 64px;
            display: flex;
            align-items: center;
            padding: 0 4px 0 4px;
        }

        /* Navigation icon */
        .topbar-nav-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--md-on-surface);
            -webkit-tap-highlight-color: transparent;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        .topbar-nav-btn:active::after {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--state-press);
            border-radius: 50%;
        }

        .topbar-nav-btn svg {
            width: 24px;
            height: 24px;
        }

        .topbar-title {
            flex: 1;
            font-family: 'Syne', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--md-on-surface);
            letter-spacing: 0;
            padding-left: 4px;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
        }

        .topbar-action-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--md-on-surface-var);
            -webkit-tap-highlight-color: transparent;
            position: relative;
            overflow: hidden;
        }

        .topbar-action-btn:active::after {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--state-press);
            border-radius: 50%;
        }

        .topbar-action-btn svg {
            width: 24px;
            height: 24px;
            position: absolute;
            transition: transform .32s var(--spring), opacity .22s;
        }

        .i-sun {
            opacity: 1;
            transform: scale(1);
        }

        .i-moon {
            opacity: 0;
            transform: scale(.15) rotate(-60deg);
        }

        [data-theme="light"] .i-sun {
            opacity: 0;
            transform: scale(.15) rotate(60deg);
        }

        [data-theme="light"] .i-moon {
            opacity: 1;
            transform: scale(1);
        }

        /* ── SCROLL ROOT ─────────────────────── */
        .root {
            position: relative;
            z-index: 1;
            padding-top: calc(64px + env(safe-area-inset-top, 0px));
            padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px));
        }

        .hero-card {
            margin: 14px 16px 8px;
            border-radius: 28px;
            overflow: hidden;
            position: relative;
            animation: scaleIn .5s var(--ease) .1s both;
            background: var(--md-surface-2);
            border: 1px solid var(--md-outline-var);
        }

        /* Top gradient band */
        .hero-top-band {
            background: var(--md-primary-container);
            padding: 22px 20px 56px;
            position: relative;
            overflow: hidden;
        }

        /* Mesh blobs */
        .hero-top-band::before {
            content: '';
            position: absolute;
            top: -60px;
            right: -60px;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(114, 219, 160, .28) 0%, transparent 70%);
            animation: blobFloat 5s ease-in-out infinite;
        }

        .hero-top-band::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 30%;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(126, 212, 214, .18) 0%, transparent 70%);
            animation: blobFloat 6.5s ease-in-out infinite reverse;
        }

        .hero-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--md-on-primary-cont);
            opacity: .65;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            z-index: 1;
            animation: fadeDown .5s var(--ease) .2s both;
        }

        .hero-label::before {
            content: '';
            display: inline-block;
            width: 18px;
            height: 2px;
            background: var(--md-on-primary-cont);
            opacity: .5;
            border-radius: 1px;
        }

        .hero-title {
            font-family: 'Syne', sans-serif;
            font-size: 32px;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -.8px;
            color: var(--md-on-primary-cont);
            margin-bottom: 0;
            position: relative;
            z-index: 1;
            animation: fadeUp .55s var(--ease) .3s both;
        }

        /* Bottom info row */
        .hero-bottom {
            padding: 14px 20px 18px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            position: relative;
            margin-top: -28px;
            animation: fadeUp .5s var(--ease) .45s both;
        }

        /* Floating title card overlap */
        .hero-desc-wrap {
            flex: 1;
            min-width: 0;
            background: var(--md-surface-3);
            border-radius: 16px;
            padding: 12px 14px;
            border: 1px solid var(--md-outline-var);
            margin-top: 0;
        }

        .hero-desc {
            font-size: 13px;
            font-weight: 400;
            line-height: 1.55;
            color: var(--md-on-surface-var);
            margin: 0;
        }

        /* Stats column */
        .hero-stats-col {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
            margin-top: 0;
        }

        .hero-stat-pill {
            display: flex;
            align-items: center;
            gap: 7px;
            background: var(--md-primary-container);
            border-radius: 50px;
            padding: 7px 13px 7px 10px;
            white-space: nowrap;
        }

        .hero-stat-pill svg {
            width: 14px;
            height: 14px;
            color: var(--md-on-primary-cont);
            flex-shrink: 0;
        }

        .hero-stat-pill span {
            font-size: 12px;
            font-weight: 700;
            color: var(--md-on-primary-cont);
            letter-spacing: .1px;
        }

        /* M3 chip row (kept for compat, hidden now) */
        .hero-chips {
            display: none;
        }

        .m3-chip {
            display: none;
        }

        /* ── SECTION HEADER ──────────────────── */
        .sec-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px 10px;
            animation: fadeUp .4s var(--ease) .55s both;
        }

        .sec-title-text {
            font-family: 'Syne', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: .1px;
            color: var(--md-on-surface);
        }

        .sec-count-chip {
            height: 28px;
            padding: 0 12px;
            border-radius: 8px;
            background: var(--md-secondary-cont);
            color: var(--md-on-secondary-cont);
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
        }

        /* ── CARD LIST ───────────────────────── */
        .card-list {
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* ── SKELETON ────────────────────────── */
        .skel-item {
            border-radius: 16px;
            overflow: hidden;
            background: var(--md-surface-1);
            display: flex;
            align-items: stretch;
            height: 104px;
            animation: fadeUp .4s var(--ease) both;
        }

        .skel-item:nth-child(1) {
            animation-delay: .05s;
        }

        .skel-item:nth-child(2) {
            animation-delay: .12s;
        }

        .skel-item:nth-child(3) {
            animation-delay: .19s;
        }

        .skel-item:nth-child(4) {
            animation-delay: .26s;
        }

        /* shimmer wave */
        .sk {
            background: linear-gradient(90deg,
                    var(--sk-b) 0%,
                    var(--sk-b) 20%,
                    var(--sk-s) 50%,
                    var(--sk-b) 80%,
                    var(--sk-b) 100%);
            background-size: 600px 100%;
            animation: shimmer 1.8s ease-in-out infinite;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }

        /* Glint highlight on top of shimmer */
        .sk::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, .08) 0%,
                    transparent 60%);
            pointer-events: none;
        }

        .sk-thumb {
            width: 104px;
            flex-shrink: 0;
            border-radius: 0;
        }

        .sk-body {
            flex: 1;
            padding: 16px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: var(--md-surface-1);
        }

        .sk-tag {
            height: 11px;
            width: 42%;
            border-radius: 6px;
        }

        .sk-name {
            height: 18px;
            width: 72%;
            border-radius: 6px;
        }

        .sk-btn {
            height: 30px;
            width: 55%;
            border-radius: 8px;
        }

        /* Stagger shimmer delay per item */
        .skel-item:nth-child(1) .sk {
            animation-delay: 0s;
        }

        .skel-item:nth-child(2) .sk {
            animation-delay: .18s;
        }

        .skel-item:nth-child(3) .sk {
            animation-delay: .36s;
        }

        .skel-item:nth-child(4) .sk {
            animation-delay: .54s;
        }

        /* ── DESIGN CARD (M3 "filled tonal" card) ── */
        .design-card {
            display: flex;
            align-items: stretch;
            border-radius: 16px;
            overflow: hidden;
            background: var(--md-surface-1);
            cursor: pointer;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            transition: background var(--t);
            min-height: 104px;
            box-shadow: var(--md-shadow);
        }

        /* State layer */
        .card-state {
            position: absolute;
            inset: 0;
            background: var(--md-primary);
            opacity: 0;
            transition: opacity .2s;
            pointer-events: none;
            border-radius: 16px;
            z-index: 1;
        }

        .design-card:active .card-state {
            opacity: .12;
        }

        /* Ripple */
        .card-rpl {
            position: absolute;
            inset: 0;
            overflow: hidden;
            border-radius: 16px;
            pointer-events: none;
            z-index: 5;
        }

        .rpl-c {
            position: absolute;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            margin: -40px 0 0 -40px;
            background: var(--md-primary);
            opacity: .18;
            transform: scale(0);
            animation: ripM3 .5s var(--ease) forwards;
        }

        /* THUMBNAIL */
        .card-thumb {
            width: 104px;
            flex-shrink: 0;
            overflow: hidden;
            position: relative;
            background: var(--md-surface-3);
            border-radius: 16px 0 0 16px;
        }

        .card-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
            display: block;
        }

        .thumb-ph {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .thumb-ph svg {
            width: 28px;
            height: 28px;
            color: var(--md-outline);
            opacity: .5;
        }

        /* Badge on thumbnail */
        .card-badge {
            position: absolute;
            top: 8px;
            left: 0;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: .3px;
            text-transform: uppercase;
            padding: 3px 8px 3px 6px;
            border-radius: 0 6px 6px 0;
            pointer-events: none;
            z-index: 4;
        }

        .b-popular {
            background: var(--md-tertiary-cont);
            color: var(--md-on-tertiary-cont);
        }

        .b-recommended {
            background: var(--md-primary-container);
            color: var(--md-on-primary-cont);
        }

        /* CARD CONTENT */
        .card-content {
            flex: 1;
            min-width: 0;
            padding: 14px 14px 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            z-index: 2;
        }

        .card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .card-tag {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .4px;
            color: var(--md-primary);
        }

        .card-style-chip {
            font-size: 10px;
            font-weight: 700;
            color: var(--md-on-secondary-cont);
            background: var(--md-secondary-cont);
            padding: 2px 8px;
            border-radius: 6px;
        }

        .card-name {
            font-family: 'Syne', sans-serif;
            font-size: 15px;
            font-weight: 700;
            color: var(--md-on-surface);
            letter-spacing: -.2px;
            line-height: 1.3;
            margin-bottom: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* M3 filled tonal button */
        .card-cta {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 32px;
            padding: 0 14px;
            border-radius: 8px;
            background: var(--md-primary-container);
            border: none;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .3px;
            color: var(--md-on-primary-cont);
            -webkit-tap-highlight-color: transparent;
            transition: all .2s;
            width: fit-content;
        }

        .card-cta svg {
            width: 14px;
            height: 14px;
        }

        .card-cta:active {
            filter: brightness(.88);
            transform: scale(.96);
        }

        /* ── M3 BOTTOM SHEET ─────────────────── */
        .sheet-scrim {
            position: fixed;
            inset: 0;
            z-index: 500;
            background: var(--md-scrim);
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s ease;
        }

        .sheet-scrim.open {
            opacity: 1;
            pointer-events: all;
        }

        .m3-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--md-surface-1);
            border-radius: 28px 28px 0 0;
            transform: translateY(100%);
            transition: transform .4s var(--ease);
            overflow: hidden;
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        .sheet-scrim.open .m3-sheet {
            transform: translateY(0);
        }

        /* Drag handle */
        .sheet-handle {
            display: flex;
            justify-content: center;
            padding: 12px 0 8px;
        }

        .sheet-handle::after {
            content: '';
            width: 32px;
            height: 4px;
            border-radius: 2px;
            background: var(--md-outline-var);
        }

        /* Sheet preview */
        .sheet-img {
            width: 100%;
            height: 56vw;
            max-height: 300px;
            min-height: 180px;
            overflow: hidden;
            background: var(--md-surface-3);
            border-radius: 16px;
            margin: 0 16px;
            width: calc(100% - 32px);
            position: relative;
        }

        .sheet-img img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: top;
            display: none;
            border-radius: 16px;
        }

        .sheet-img-ph {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .sheet-img-ph svg {
            width: 40px;
            height: 40px;
            color: var(--md-outline);
            opacity: .4;
        }

        .sheet-img-ph span {
            font-size: 11px;
            letter-spacing: 1px;
            color: var(--md-outline);
            text-transform: uppercase;
        }

        /* Sheet close */
        .sheet-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--md-surface-3);
            border: none;
            display: grid;
            place-items: center;
            cursor: pointer;
            color: var(--md-on-surface);
            -webkit-tap-highlight-color: transparent;
            z-index: 10;
            transition: background .2s;
        }

        .sheet-close:active {
            background: var(--md-surface-4);
            transform: scale(.9);
        }

        .sheet-close svg {
            width: 18px;
            height: 18px;
        }

        /* Sheet body */
        .sheet-body {
            padding: 20px 20px 0;
        }

        /* M3 headline + supporting */
        .sheet-headline {
            font-family: 'Syne', sans-serif;
            font-size: 24px;
            font-weight: 800;
            color: var(--md-on-surface);
            letter-spacing: -.3px;
            margin-bottom: 4px;
        }

        .sheet-supporting {
            font-size: 14px;
            font-weight: 400;
            color: var(--md-on-surface-var);
            margin-bottom: 6px;
        }

        .sheet-style-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 30px;
            padding: 0 12px;
            border-radius: 8px;
            background: var(--md-primary-container);
            color: var(--md-on-primary-cont);
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        /* Sheet actions */
        .sheet-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-bottom: 16px;
        }

        /* M3 filled button */
        .btn-filled {
            width: 100%;
            height: 56px;
            border-radius: 16px;
            background: var(--md-primary);
            color: var(--md-on-primary);
            border: none;
            cursor: pointer;
            font-family: 'Syne', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: .1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
            transition: all .2s;
            box-shadow: var(--md-shadow-2);
            position: relative;
            overflow: hidden;
        }

        .btn-filled::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0);
            transition: background .2s;
        }

        .btn-filled:active::after {
            background: rgba(0, 0, 0, .12);
        }

        .btn-filled svg {
            width: 18px;
            height: 18px;
        }

        /* M3 tonal button */
        .btn-tonal {
            width: 100%;
            height: 48px;
            border-radius: 14px;
            background: var(--md-secondary-cont);
            color: var(--md-on-secondary-cont);
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            -webkit-tap-highlight-color: transparent;
            transition: all .2s;
        }

        .btn-tonal:active {
            filter: brightness(.9);
        }

        /* ── M3 BOTTOM NAV ───────────────────── */
        #bnav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 400;
            padding-bottom: env(safe-area-inset-bottom, 0px);
            background: var(--md-surface-2);
            border-top: 1px solid var(--md-outline-var);
            transition: background var(--t);
        }

        .bnav-row {
            display: flex;
            height: 80px;
            align-items: flex-start;
            padding-top: 12px;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }

        /* M3 nav indicator pill */
        .nav-indicator {
            width: 64px;
            height: 32px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            transition: background .2s;
        }

        .nav-item.active .nav-indicator {
            background: var(--md-secondary-cont);
        }

        .nav-indicator svg {
            width: 24px;
            height: 24px;
            color: var(--md-on-surface-var);
            transition: color .2s;
        }

        .nav-item.active .nav-indicator svg {
            color: var(--md-on-secondary-cont);
        }

        .nav-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--md-on-surface-var);
            letter-spacing: .4px;
            transition: color .2s, font-weight .2s;
        }

        .nav-item.active .nav-label {
            color: var(--md-on-surface);
            font-weight: 700;
        }

        /* ── FAB ─────────────────────────────── */
        #fab {
            position: fixed;
            bottom: calc(96px + env(safe-area-inset-bottom, 0px));
            right: 16px;
            z-index: 200;
        }

        .fab-btn {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: var(--md-primary-container);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--md-shadow-3);
            -webkit-tap-highlight-color: transparent;
            transition: all .2s var(--spring);
            color: var(--md-on-primary-cont);
            animation: fabPop .6s var(--spring) .7s both;
        }

        .fab-btn:active {
            transform: scale(.88);
            box-shadow: var(--md-shadow);
        }

        .fab-btn svg {
            width: 24px;
            height: 24px;
        }

        /* ── FOOTER ──────────────────────────── */
        .footer {
            margin: 16px 16px 0;
            padding: 16px 4px;
            border-top: 1px solid var(--md-outline-var);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .footer-text {
            font-size: 12px;
            font-weight: 400;
            color: var(--md-outline);
        }

        .footer-text a {
            color: var(--md-primary);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-icons {
            display: flex;
            gap: 4px;
        }

        .footer-icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--md-on-surface-var);
            border: none;
            background: transparent;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
            transition: background .2s;
            cursor: pointer;
        }

        .footer-icon-btn:active {
            background: var(--md-surface-3);
        }

        .footer-icon-btn svg {
            width: 20px;
            height: 20px;
        }

        /* TABLET (560px–899px) — centered narrow column */
        @media (min-width: 560px) and (max-width: 899px) {
            .root {
                max-width: 480px;
                margin: 0 auto;
            }

            #topbar {
                left: 0;
                right: 0;
                max-width: none;
                transform: none;
            }

            #bnav {
                
                left: 50%;
                transform: translateX(-50%);
                right: auto;
                width: 100%;
            }

            #fab {
                right: auto;
                left: calc(50% + 480px/2 - 72px);
                transform: none;
            }

            .sheet-scrim {
                display: flex;
                align-items: flex-end;
                justify-content: center;
            }

            .m3-sheet {
                max-width: 480px;
                left: 50%;
                transform: translateX(-50%) translateY(100%);
                right: auto;
            }

            .sheet-scrim.open .m3-sheet {
                transform: translateX(-50%) translateY(0);
            }
        }

        /* DESKTOP (900px+) — full sidebar + content layout */
        @media (min-width: 900px) {

            /* Hide mobile bottom nav & FAB */
            #bnav {
                display: none;
            }

            #fab {
                display: none;
            }

            /* Topbar spans full width, taller */
            #topbar {
                max-width: none;
                left: 0;
                right: 0;
                height: calc(68px + env(safe-area-inset-top, 0px));
                padding: env(safe-area-inset-top, 0px) 32px 0 32px;
                transform: none;
            }

            .topbar-inner {
                max-width: 1200px;
                margin: 0 auto;
                padding: 0 0;
            }

            .topbar-title {
                font-size: 20px;
            }

            /* Root: no bottom-nav padding, full viewport */
            .root {
                max-width: none;
                padding-top: calc(68px + env(safe-area-inset-top, 0px));
                padding-bottom: 40px;
                display: grid;
                grid-template-columns: 340px 1fr;
                grid-template-rows: auto auto 1fr auto;
                column-gap: 28px;
                max-width: 1200px;
                margin: 0 auto;
                padding-left: 32px;
                padding-right: 32px;
            }

            /* Hero card — left column, spans rows 1 & 2 */
            .hero-card {
                grid-column: 1;
                grid-row: 1 / 3;
                margin: 24px 0 0 0;
                align-self: start;
                position: sticky;
                top: calc(68px + env(safe-area-inset-top, 0px) + 16px);
            }

            /* Bigger hero text on desktop */
            .hero-title {
                font-size: 38px;
                letter-spacing: -1px;
            }

            .hero-top-band {
                padding: 28px 24px 64px;
            }

            /* Section header — right column row 1 */
            .sec-header {
                grid-column: 2;
                grid-row: 1;
                padding: 24px 0 12px 0;
                align-self: end;
            }

            /* Card list — right column row 2 (fills remaining height) */
            .card-list {
                grid-column: 2;
                grid-row: 2;
                padding: 0;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 14px;
                align-content: start;
            }

            /* Cards become vertical (stack thumb on top) in grid */
            .design-card {
                flex-direction: column;
                min-height: 220px;
                border-radius: 20px;
            }

            .card-thumb {
                width: 100%;
                height: 180px;
                border-radius: 20px 20px 0 0;
                flex-shrink: 0;
            }

            .card-content {
                padding: 14px 16px 16px;
            }

            .card-name {
                white-space: normal;
            }

            /* Skeleton also grid */
            #skel-box {
                grid-column: 2;
                grid-row: 2;
                padding: 0;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 14px;
            }

            .skel-item {
                flex-direction: column;
                height: 220px;
            }

            .sk-thumb {
                width: 100%;
                height: 140px;
            }

            /* Footer — full width, row 3 */
            .footer {
                grid-column: 1 / -1;
                grid-row: 3;
                margin: 20px 0 0 0;
            }

            /* Bottom sheet as centered modal dialog on desktop */
            .sheet-scrim {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .m3-sheet {
                position: relative;
                bottom: auto;
                left: auto;
                right: auto;
                max-width: 560px;
                width: 100%;
                border-radius: 28px;
                transform: scale(0.92) translateY(0);
                opacity: 0;
                transition: transform .35s var(--ease), opacity .3s ease;
                max-height: 90vh;
                overflow-y: auto;
            }

            .sheet-scrim.open .m3-sheet {
                transform: scale(1) translateY(0);
                opacity: 1;
            }

            .sheet-handle {
                display: none;
            }

            .sheet-img {
                height: 320px;
                max-height: 320px;
            }
        }

        /* WIDE DESKTOP (1280px+) */
        @media (min-width: 1280px) {
            .root {
                max-width: 1320px;
            }

            .card-list {
                grid-template-columns: 1fr 1fr 1fr;
            }

            #skel-box {
                grid-template-columns: 1fr 1fr 1fr;
            }
        }
    </style>
</head>

                        stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                </div>
                <span class="nav-label">Me</span>
            </a>
        </div>
    </nav>

    <!-- BOTTOM SHEET -->
    <div class="sheet-scrim" id="scrim">
        <div class="m3-sheet" id="sheetEl">
            <div class="sheet-handle"></div>
            <div class="sheet-img" id="sheetImg">
                <button class="sheet-close" id="sheetClose">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                        stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
                <div class="sheet-img-ph" id="sheetPh">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                        stroke-width="1">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414A1 1 0 0119 6.414V19a2 2 0 01-2 2z" />
                    </svg>
                    <span>Loading…</span>
                </div>
            </div>
            <div class="sheet-body">
                <div class="sheet-style-label" id="sheetStyleLabel"></div>
                <div class="sheet-headline" id="sheetHeadline"></div>
                <div class="sheet-supporting">Cover Design Template · NWU</div>
                <div class="sheet-actions">
                    <a href="#" class="btn-filled" id="sheetUse">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                            stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        Use this template
                    </a>
                    <button class="btn-tonal" id="sheetCancel">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const html = document.documentElement;

        /* Theme */
        document.getElementById('themeBtn').addEventListener('click', () => {
            html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        });

        /* Scroll → topbar elevation */
        window.addEventListener('scroll', () => {
            document.getElementById('topbar').classList.toggle('scrolled', scrollY > 4);
        }, { passive: true });

        /* Veil */
        const veil = document.getElementById('veil');
        function goTo(href) { veil.classList.add('out'); setTimeout(() => location.href = href, 240); }

        /* Ripple */
        function ripple(card, e) {
            const l = card.querySelector('.card-rpl'); if (!l) return;
            const d = document.createElement('span'); d.className = 'rpl-c';
            const r = l.getBoundingClientRect();
            d.style.cssText = `left:${e.clientX - r.left}px;top:${e.clientY - r.top}px;`;
            l.appendChild(d); d.addEventListener('animationend', () => d.remove());
        }

        /* Data */
        const DESIGNS = [
            { id: 'style1', name: 'North Western University', preview: 'designs/style1/preview.png', badge: 'popular' },
            { id: 'style2', name: 'North Western University', preview: 'designs/style2/preview.png', badge: 'recommended' },
            { id: 'style3', name: 'North Western University', preview: 'designs/style3/preview.png', badge: null },
            { id: 'style4', name: 'North Western University', preview: 'designs/style4/preview.png', badge: null },
        ];
        const BADGE = { popular: 'Popular', recommended: 'Recommended' };
        const sP = new URLSearchParams(location.search).get('s');

        document.getElementById('chip-count').textContent = DESIGNS.length + ' Templates';
        document.getElementById('count-chip').textContent = DESIGNS.length + ' available';

        /* Sheet */
        const scrim = document.getElementById('scrim');
        const sheetEl = document.getElementById('sheetEl');
        const sheetImg = document.getElementById('sheetImg');
        const sheetPh = document.getElementById('sheetPh');
        const sheetLabel = document.getElementById('sheetStyleLabel');
        const sheetTitle = document.getElementById('sheetHeadline');
        const sheetUse = document.getElementById('sheetUse');
        let prevImg = null;

        function openSheet(d, i) {
            sheetLabel.textContent = 'Template 0' + (i + 1);
            sheetTitle.textContent = d.name;
            sheetUse.href = 'form.html?design=' + d.id + (sP ? '&s=' + sP : '');

            if (prevImg) { prevImg.remove(); prevImg = null; }
            sheetPh.style.display = 'flex';

            if (d.preview) {
                prevImg = document.createElement('img');
                prevImg.src = d.preview; prevImg.alt = d.name;
                prevImg.onload = () => { sheetPh.style.display = 'none'; prevImg.style.display = 'block'; };
                sheetImg.appendChild(prevImg);
            }

            scrim.classList.add('open');
            document.body.style.overflow = 'hidden';

            /* Drag dismiss */
            let sy = 0, cy = 0, active = false;
            const ts = e => { sy = e.touches[0].clientY; cy = 0; active = true; sheetEl.style.transition = 'none'; };
            const tm = e => {
                if (!active) return;
                cy = Math.max(0, e.touches[0].clientY - sy);
                sheetEl.style.transform = `translateY(${cy}px)`;
                if (e.cancelable) e.preventDefault();
            };
            const te = () => {
                if (!active) return; active = false; sheetEl.style.transition = '';
                cy > 80 ? (close(), sheetEl.style.transform = '') : (sheetEl.style.transform = '');
            };
            sheetEl.addEventListener('touchstart', ts, { passive: true });
            sheetEl.addEventListener('touchmove', tm, { passive: false });
            sheetEl.addEventListener('touchend', te);
        }

        function close() {
            scrim.classList.remove('open');
            document.body.style.overflow = '';
        }

        document.getElementById('sheetClose').addEventListener('click', close);
        document.getElementById('sheetCancel').addEventListener('click', close);
        scrim.addEventListener('click', e => { if (e.target === scrim) close(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
        sheetUse.addEventListener('click', e => { e.preventDefault(); close(); setTimeout(() => goTo(sheetUse.href), 200); });

        /* Render cards */
        const cardsEl = document.getElementById('cards');
        const skelBox = document.getElementById('skel-box');

        const PH_INNER = `<div class="thumb-ph"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414A1 1 0 0119 6.414V19a2 2 0 01-2 2z"/></svg></div>`;

        setTimeout(() => {
            DESIGNS.forEach((d, i) => {
                const wrap = document.createElement('div');
                wrap.style.animation = `cardRise .5s cubic-bezier(0.2,0,0,1) ${i * .1}s both`;

                const card = document.createElement('div');
                card.className = 'design-card';
                card.innerHTML = `<div class="card-state"></div><div class="card-rpl"></div>`;

                /* Thumb */
                const thumb = document.createElement('div'); thumb.className = 'card-thumb';
                if (d.preview) {
                    const img = document.createElement('img');
                    img.src = d.preview; img.alt = d.name; img.loading = 'lazy';
                    img.onerror = () => { thumb.innerHTML = PH_INNER; };
                    thumb.appendChild(img);
                } else { thumb.innerHTML = PH_INNER; }

                if (d.badge) {
                    const b = document.createElement('div');
                    b.className = 'card-badge b-' + d.badge;
                    b.textContent = BADGE[d.badge];
                    thumb.appendChild(b);
                }

                /* Content */
                const content = document.createElement('div'); content.className = 'card-content';
                content.innerHTML = `
        <div>
          <div class="card-top">
            <span class="card-tag">Cover Design</span>
            <span class="card-style-chip">0${i + 1}</span>
          </div>
          <div class="card-name">${d.name}</div>
        </div>
        <button class="card-cta">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
          Preview
        </button>`;

                card.appendChild(thumb);
                card.appendChild(content);

                card.addEventListener('click', e => { ripple(card, e); openSheet(d, i); });
                card.setAttribute('role', 'button'); card.setAttribute('tabindex', '0');
                card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openSheet(d, i); } });

                wrap.appendChild(card);
                cardsEl.appendChild(wrap);
            });

            skelBox.style.transition = 'opacity .28s';
            skelBox.style.opacity = '0';
            setTimeout(() => {
                skelBox.remove();
                cardsEl.style.display = '';
                /* bounce the count chip once cards appear */
                const chip = document.getElementById('count-chip');
                if (chip) { chip.style.animation = 'chipBounce .5s var(--spring) both'; }
            }, 280);
        }, 650);
    </script>
</body>

</html>
